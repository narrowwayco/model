<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #050505;
      overflow: hidden;
      font-family: "Malgun Gothic", Arial, sans-serif;
    }

    .wrap {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .title {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .desc {
      font-size: 22px;
      color: #cfcfcf;
      margin-bottom: 40px;
    }

    .loader {
      width: 64px;
      height: 64px;
      border: 6px solid #333;
      border-top: 6px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">프로그램을 시작하는 중입니다</div>
    <div class="desc">잠시만 기다려 주세요</div>
    <div class="loader"></div>
  </div>
</body>
</html>
